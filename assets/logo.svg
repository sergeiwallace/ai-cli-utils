<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="prompt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#39ff14"/>
    </linearGradient>
    <filter id="arcglow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="66" x2="200" y2="66" stroke="#ffffff" stroke-width="0.4" opacity="0.05"/>
  <line x1="0" y1="133" x2="200" y2="133" stroke="#ffffff" stroke-width="0.4" opacity="0.05"/>
  <line x1="66" y1="0" x2="66" y2="200" stroke="#ffffff" stroke-width="0.4" opacity="0.05"/>
  <line x1="133" y1="0" x2="133" y2="200" stroke="#ffffff" stroke-width="0.4" opacity="0.05"/>

  <!-- Neural nodes — same positions as v1, green -->
  <circle cx="30"  cy="30"  r="3.5" fill="#00ff88" opacity="0.5"/>
  <circle cx="100" cy="20"  r="3.5" fill="#39ff14" opacity="0.5"/>
  <circle cx="170" cy="30"  r="3.5" fill="#00ff88" opacity="0.5"/>
  <circle cx="170" cy="170" r="3.5" fill="#39ff14" opacity="0.5"/>
  <circle cx="30"  cy="170" r="3.5" fill="#00ff88" opacity="0.5"/>
  <circle cx="20"  cy="100" r="3.5" fill="#39ff14" opacity="0.4"/>
  <circle cx="180" cy="100" r="3.5" fill="#00ff88" opacity="0.4"/>

  <!-- Node connections -->
  <line x1="30"  y1="30"  x2="100" y2="20"  stroke="#00ff88" stroke-width="0.8" opacity="0.15"/>
  <line x1="100" y1="20"  x2="170" y2="30"  stroke="#39ff14" stroke-width="0.8" opacity="0.15"/>
  <line x1="30"  y1="30"  x2="20"  y2="100" stroke="#00ff88" stroke-width="0.8" opacity="0.15"/>
  <line x1="170" y1="30"  x2="180" y2="100" stroke="#39ff14" stroke-width="0.8" opacity="0.15"/>
  <line x1="20"  y1="100" x2="30"  y2="170" stroke="#00ff88" stroke-width="0.8" opacity="0.15"/>
  <line x1="180" y1="100" x2="170" y2="170" stroke="#39ff14" stroke-width="0.8" opacity="0.15"/>

  <!-- _ centered as the mouth -->
  <text x="100" y="112"
        text-anchor="middle"
        font-family="'SF Mono','Fira Code','Courier New',monospace"
        font-size="86" font-weight="700"
        fill="url(#prompt)" filter="url(#glow)" opacity="0.95">_</text>

  <!-- right eye: upward arc like a happy eyelash/squint -->
  <path d="M 118,88 Q 131,70 144,88"
        fill="none" stroke="#00ff88" stroke-width="9" stroke-linecap="round"
        filter="url(#arcglow)" opacity="0.85"/>

  <!-- > smaller, tip slightly overlapping left edge of _ -->
  <text x="48" y="106"
        text-anchor="start"
        font-family="'SF Mono','Fira Code','Courier New',monospace"
        font-size="70" font-weight="700"
        fill="url(#prompt)" filter="url(#glow)" opacity="0.95">&#62;</text>
</svg>
