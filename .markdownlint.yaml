# Markdownlint configuration
# https://github.com/DavidAnson/markdownlint

# Allow duplicate heading names
MD024: false

# No line length limit (editor word-wrap handles display)
MD013: false

# Allow inline HTML
MD033: false

# Allow emphasis used as heading
MD036: false

# Don't require blank lines around headings
MD022: false

# Don't require blank lines around fenced code blocks
MD031: false

# Don't require blank lines around lists
MD032: false

# Don't require H1 as first line (agent files, signal files, and templates don't need headings)
MD041: false

# Don't enforce table column alignment style
MD060: false

# Allow H1 in body when frontmatter has title (research docs and design docs use both)
MD025:
  front_matter_title: ""

# Don't validate link fragments (anchors with special chars and auto-generated READMEs break the checker)
MD051: false

# Don't enforce horizontal rule style
MD035: false

# Don't require files to end with newline (auto-generated files often don't)
MD047: false

# Don't enforce unordered list indentation style (AI-generated docs use varied indentation)
MD007: false

# Don't enforce ordered list prefix style — some lists deliberately start at non-1
# (e.g. CLAUDE.md/GEMINI.md session startup steps continue numbering from the global config)
MD029: false

# Don't require language on fenced code blocks — many design/plan docs use plain blocks
# for shell sessions, config snippets, and ASCII diagrams where no language tag applies
MD040: false

# Don't reject blank lines inside blockquotes — feedback sections in design/plan docs
# deliberately use blank lines for readability (project convention)
MD028: false

# Don't enforce atx-only heading style — feedback sections use `> ---` separator which
# markdownlint misreads as a setext heading underline (project convention: > --- as divider)
MD003: false

# Don't enforce list marker spacing — docs use 2-space indented lists for visual clarity
MD030: false

# Don't reject trailing punctuation in headings — "Key:", "Format:", "Note:" headings are common
MD026: false

# Don't validate table column counts — docs use multi-line cells and empty cells legitimately
MD056: false

# Don't require angle brackets around bare URLs — reference docs use bare URLs for readability
MD034: false

# Don't enforce unordered list bullet style — docs mix * and - bullets
MD004: false

# Don't enforce strict heading level increments — design doc appendices skip from h2 to h4
# for visual structure in decision sections (## Appendix → #### Decision N → ##### Options)
MD001: false

# Standardize emphasis on asterisk (AIH-160; markdownlint v0.23 default flags inconsistent _/* usage)
MD049:
  style: asterisk
MD050:
  style: asterisk

# Don't reject spaces inside code spans — audit/plan docs show literal patterns
# with intentional trailing spaces (e.g. git conflict markers `^<<<<<<< `)
MD038: false
