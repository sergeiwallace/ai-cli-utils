# Markdownlint configuration
# https://github.com/DavidAnson/markdownlint

# Allow duplicate heading names
MD024: false

# No line length limit (editor word-wrap handles display)
MD013: false

# Allow inline HTML
MD033: false

# Allow emphasis used as heading
MD036: false

# Don't require blank lines around headings
MD022: false

# Don't require blank lines around fenced code blocks
MD031: false

# Don't require blank lines around lists
MD032: false

# Don't require H1 as first line (agent files, signal files, and templates don't need headings)
MD041: false

# Don't enforce table column alignment style
MD060: false

# Allow H1 in body when frontmatter has title (research docs and design docs use both)
MD025:
  front_matter_title: ""

# Don't validate link fragments (anchors with special chars and auto-generated READMEs break the checker)
MD051: false

# Don't enforce horizontal rule style
MD035: false

# Don't require files to end with newline (auto-generated files often don't)
MD047: false

# Don't enforce unordered list indentation style (AI-generated docs use varied indentation)
MD007: false
