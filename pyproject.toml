[project]
name = "ai-cli-utils"
version = "0.2.0.post20260406190013"
description = "Unified AI session manager for Claude Code and Gemini CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Sergei Wallace", email = "dev@sergeiwallace.com" },
]
keywords = ["ai", "cli", "claude", "gemini", "tmux", "mosh", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "nats-py>=2.9.0",
    "circus>=0.18.0",
    "libtmux>=0.30.0",
    "watchdog>=4.0.0",
    "google-genai>=1.0.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/sergeiwallace/ai-cli-utils"
Repository = "https://github.com/sergeiwallace/ai-cli-utils"
Changelog = "https://github.com/sergeiwallace/ai-cli-utils/blob/main/CHANGELOG.md"
Issues = "https://github.com/sergeiwallace/ai-cli-utils/issues"

[project.scripts]
ai = "ai_cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_cli"]
artifacts = ["src/ai_cli/data/**"]

[tool.hatch.build.targets.sdist]
exclude = [".direnv", ".venv", ".worktrees"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "pre-commit>=4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "ruff>=0.8",
    "pre-commit>=4",
    "pytest-timeout>=2.4.0",
    "pyright>=1.1.408",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-n auto"

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "E701",  # multiple-statements-on-one-line (colon) — established compact style in main.py
    "E702",  # multiple-statements-on-one-line (semicolon) — established compact style in main.py
    "E741",  # ambiguous-variable-name — single-letter vars acceptable in comprehensions
]
