---
# Pre-commit framework config (SW-796 — adopted Option 1c Round 1, 2026-04-23).
# Runs on every `git commit` (pre-commit stage) and `git push` (pre-push stage).
#
# Install: `pre-commit install --install-hooks --hook-type pre-commit --hook-type pre-push`
# (Auto-run by copier `_tasks` on copy + update.)
#
# Update hook pins: `pre-commit autoupdate` (quarterly — see D-02 in
# sergei/docs/plans/pre-commit-linting-expansion.md).
#
# Skip hooks: `SKIP=hook-id git commit` (specific hook) or `SKIP_TESTS=1 git push`
# (test-gate.sh only — not a pre-commit-framework env var).

default_stages: [pre-commit]

repos:
  # ── File-level sanity checks (D-03 Option 3c: maximal bundle) ────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: \.jinja$
      - id: check-json
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
        exclude: ^(tests?/fixtures/|docs/examples?/)
      - id: mixed-line-ending
        args: [--fix=lf]

  # ── Markdown lint ────────────────────────────────────────────────────────
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.14.0
    hooks:
      - id: markdownlint-cli2
        exclude: ^(\.claude/|\.githooks/|node_modules/|docs/research/)


  # ── Python: ruff (check --fix + format) ──────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format


  # ── Shell: shellcheck (warning+ only — suppress info/style noise) ───────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # ── Local: worktree safety + hook-reference + test gates ─────────────────
  - repo: local
    hooks:
      - id: corrupt-index-guard
        name: corrupt index guard (worktree safety)
        entry: .githooks/corrupt-index-guard.sh
        language: script
        stages: [pre-push]
      # Fail if any .claude/settings.json hook command points at a script that
      # no longer exists (e.g. a copier _exclude removed it but the
      # _skip_if_exists settings.json still references it). Cheap; runs every
      # commit so it also catches script deletions that don't touch settings.json.
      - id: validate-claude-settings
        name: validate .claude/settings.json hook script refs exist
        entry: .githooks/validate-claude-settings.py
        language: script
        pass_filenames: false
        always_run: true
      - id: test-gate
        name: test gate (mise-aware, tech-stack auto-detect)
        entry: .githooks/test-gate.sh
        language: script
        stages: [pre-push]
        pass_filenames: false
        always_run: true
      # Reject a push that introduces a duplicate PREFIX-N roadmap entry id
      # (pre-existing dups on origin/main are grandfathered). AIH-89 T-02.
      # Bypass: SKIP=roadmap-guard git push
      - id: roadmap-guard
        name: roadmap-guard (no new duplicate PREFIX-N ids)
        entry: .githooks/roadmap-guard.sh
        language: script
        stages: [pre-push]
        pass_filenames: false
        always_run: true
