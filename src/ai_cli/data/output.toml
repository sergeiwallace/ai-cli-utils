# Shipped defaults for every log-line element. A user's `[output]` table in
# config.toml is layered over this one key by key, and the result is validated
# as a whole: an invalid user table is set aside and these defaults render.
# Every key must be present here; the loader refuses any key not listed.

[output]
order = ["datetime", "tag", "operation", "level", "description"]
separator = " "

[output.elements.datetime]
enabled = true
format = "%Y-%m-%d %H:%M:%S %Z"
timezone = "America/New_York"
prefix = ""
suffix = ""
style = "dim"
pattern = '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} [A-Z]{2,5}$'

[output.elements.tag]
enabled = true
prefix = "["
suffix = "]"
style = "bold blue"
pattern = '^[a-z0-9_-]+$'

[output.elements.tag.styles]

[output.elements.operation]
enabled = true
required = true
default = "general"
prefix = ""
suffix = ":"
style = "bold cyan"
pattern = '^[a-z][a-z0-9-]*$'
# Every operation the package emits. A user's table may add operations but not remove
# these. The launch phases come first, then the operations of the other commands.
vocabulary = [
    "start", "request", "install", "update", "reexec", "remote", "probe", "transport",
    "connect", "reconnect", "auth-wait", "session", "worktree", "terminal", "tmux", "direnv",
    "mode", "handoff", "ensure", "reload", "config", "load", "plan", "cleanup", "exit", "general",
    "adopt", "allocate", "apply", "attach", "audit", "check", "compact", "configure", "heartbeat",
    "history", "lease", "list", "migrate", "notify", "open", "profiles", "prune", "pull", "push",
    "refresh", "register", "repair", "report", "resolve", "restore", "resume", "retire", "scrape",
    "set", "stage", "status", "stop", "sync", "translate", "usage", "validate", "watch",
]

[output.elements.operation.styles]
handoff = "bold green"

[output.elements.level]
enabled = true
show = ["warning", "error"]
prefix = ""
suffix = ":"
style = ""

[output.elements.level.styles]
warning = "bold yellow"
error = "bold red"

[output.elements.description]
enabled = true
prefix = ""
suffix = ""
style = ""
pattern = '^[^\x00-\x1f\x7f]*$'

# The session supervisor's in-place reload row: consecutive reloads before it turns
# into a warning, and before a persistent error line names the stall.
[output.progress.reload]
warn_after = 3
error_after = 6

# Where each record goes. The terminal gets the styled line; the per-launch log file
# gets the same elements in plain text, always led by the datetime; telemetry stores
# each record at or above `min_level`, in one batch before a handoff or exit.
[output.sinks.terminal]
enabled = true

[output.sinks.file]
enabled = true

[output.sinks.telemetry]
enabled = true
min_level = "warning"
