# Beads Configuration File
# This file configures default behavior for all bd commands in this repository
# All settings can also be set via environment variables (BD_* prefix)
# or overridden with command-line flags

# Issue prefix for this repository (used by bd init)
# If not set, bd init will auto-detect from directory name
# Example: issue-prefix: "myproject" creates issues like "myproject-1", "myproject-2", etc.
issue-prefix: "AI-CLI"
# Use no-db mode: JSONL-only, no Dolt database
# When true, .beads/issues.jsonl is the only local store
# no-db: false

# Enable JSON output by default
# json: false

# Feedback title formatting for mutating commands (create/update/close/dep/edit)
# 0 = hide titles, N > 0 = truncate to N characters
# output:
#   title-length: 255

# Default actor for audit trails (overridden by BEADS_ACTOR or --actor)
# actor: ""

# Export events (audit trail) to .beads/events.jsonl on each flush/sync
# When enabled, new events are appended incrementally using a high-water mark.
# Use 'bd export --events' to trigger manually regardless of this setting.
# events-export: false

# Multi-repo configuration (experimental - bd-307)
# Allows hydrating from multiple repositories and routing writes to the correct database
# repos:
#   primary: "."  # Primary repo (where this database lives)
#   additional:   # Additional repos to hydrate from (read-only)
#     - ~/beads-planning  # Personal planning repo
#     - ~/work-planning   # Work planning repo

# Dolt-native backup (periodic backup for off-machine recovery)
# This is full database backup only. Cross-machine sync uses Dolt remotes.
# backup:
#   enabled: false     # Disable auto-backup entirely
#   interval: 15m      # Minimum time between auto-backups
#   git-push: false    # Disable git push (backup locally only)
#   git-repo: ""       # Separate git repo for backups (default: project repo)

# Optional JSONL auto-export for viewers, interchange, and issue-level migration.
# Disabled by default; enable only when an integration needs fresh .beads/issues.jsonl.
# Use relative paths under .beads/ for JSONL import/export filenames.
# export:
#   auto: false
#   path: issues.jsonl
#   interval: 60s
#   git-add: false
# import:
#   path: issues.jsonl

# Integration settings (access with 'bd config get/set')
# Non-secret keys (stored in the database):
# - jira.url, jira.project
# - linear.team_id
# - github.org, github.repo
#
# Secret keys (stored in this file but prefer env vars to avoid git exposure):
# - linear.api_key  → use LINEAR_API_KEY env var instead
# - github.token    → use GITHUB_TOKEN env var instead
# sync.remote: "git+ssh://git@github.com/sergeiwallace/ai-cli-utils.git"
export:
    auto: false
    # AIH-bqtzw / AIH-7ls8a. bd's auto-export stages the mirror with a `git add` under a
    # hardcoded 5s timeout. On EFS under load that is routinely exceeded, and a killed
    # `git add` leaves an orphaned .git/index.lock that blocks EVERY later git operation in
    # this repo, for every session. Measured firing three times on 2026-09-07.
    #
    # Suppresses STAGING only: `auto: true` above still writes .beads/issues.jsonl, so the
    # mirror converges and the divergence gates keep seeing fresh JSONL. Set here rather
    # than via BD_EXPORT_GIT_ADD because an env var reaches only the callers we wired.
    git-add: false
# sync.remote DELETED (AIH-gv9j2 option C, decided by Sergei 2026-10-08; implemented by AIH-3ptlf).
# The Dolt sync remote lives in the shared server's per-database `dolt_remotes` table, which is
# machine-local by construction, and its URL is per-machine (git+https with a keyring PAT on acn-mac,
# a git+ssh host alias on sem-kg-ec2), so a tracked value here is wrong on every machine but one.
# ai-harness's install.sh provisions the remote on each host from `git remote get-url origin`
# (idempotent, via `call dolt_remote('add', ...)` on the live server); bd_dolt_publish.py pushes with
# --no-adopt and works with this key absent. Never run `bd dolt remote add` to "fix" this: it
# rewrites AND commits this key.
# Shared Dolt server mode (AIH-1yh2c, 2026-09-16). FLEET POLICY, deliberately tracked:
# every machine runs its Beads store on the shared Dolt server, so this key carries the
# same value everywhere. Nothing machine-specific belongs in this file or metadata.json --
# the endpoint and data location are machine-local and already gitignored
# (.beads/dolt-server.port, .pid, .log, .lock; data under ~/.beads/shared-server/).
# A machine that pulls this key without having been provisioned fails with
# the bd "Dolt server unreachable" error (AIH-f6qqn). That is a provisioning gap,
# not a reason to untrack the policy: place the database directory under the server's
# data dir and restart it once.
dolt.shared-server: true

# Retired 2026-09-16 (AIH-mssv2). The store on the shared Dolt server is authoritative and
# `bd dolt push`/`pull` is the cross-machine transport (verified fast-forward d3c9ee98 -> 5900fafb).
# Auto-export rewrote this repo's git-tracked .beads/*.jsonl on every bd write, which is the
# git-conflict friction this retires.
#
# interactions.jsonl is now UNTRACKED and gitignored (2026-10-04, AIH-bq0gl D-4,
# docs/designs/aih-bq0gl-dolt-only-beads-stores.md in ai-harness). The earlier reason to keep
# it tracked -- append-only, NOT regenerable, and the Dolt `interactions` table held 0 rows, so
# git was its only copy (AIH-tvan, AIH-0zmda) -- was discharged first, not waived: its 392
# records were imported into the store's `interactions` table, published with
# bd_dolt_publish.py, and proved present on refs/dolt/data per record before it was untracked.
#
# issues.jsonl STAYS TRACKED here, unlike the other repos on this host, and that is a BLOCK not
# an oversight (AIH-ik03t). The committed mirror held 9 records, 7 comments and 1 dependency
# edge the store lacked. All of those were reconciled INTO the store by the hm7xu D-2 rules and
# published, and the field-level gate (check_beads_divergence.py --mirror-retirement-gate) is
# satisfied by content. But bd_mirror_redundancy_proof.py keys its comments population on the
# literal comment id, bd derives that id from content INCLUDING created_at, and no bd write can
# set a comment's created_at -- so those 7 comments can never carry their original identity and
# the proof cannot reach exit 0. Export on demand with `bd export -o /tmp/<file>` after a
# three-axis check; never write the export back into .beads/.
