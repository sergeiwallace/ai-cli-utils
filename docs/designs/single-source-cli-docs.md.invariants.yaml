    observable_effect: "residual case for the remaining enum value, accepted-risk"

invalid_transition_policy: every state/event pair not covered by an explicit guard above is rejected by audit_loop.py's schema validation before it can be recorded

dimensions:
  cluster: [missing-parity-coverage, caller-compatibility]

invariants:
  - id: INV-inventory-from-source
    statement: "The parity inventory for ai ps, ai layout and ai sync lists every action, positional argument and flag token their current parsers recognize, read from process_hygiene.cmd_ps, layout.run_layout_command, main.cmd_sync and sync.py's _parse_flags, sync_resolve and sync_watch at the base commit -- self-parsing-commands, missing-parity-coverage"
    kind: safety
    counterexample_test: "docs/designs/single-source-cli-docs.md Phase 1 T-1.3, the inventory table and the parity criterion that carries it"
  - id: INV-every-row-tested
    statement: "Each inventory row, every spelling included, has its own parity test through the CLI entry point, carried as parametrized data, so a converted command that stops accepting a recognized form fails a named test -- self-parsing-commands, missing-parity-coverage"
    kind: safety
    counterexample_test: "docs/designs/single-source-cli-docs.md Phase 1 T-1.3, the re-read and parametrized-data criterion"
  - id: INV-no-silent-drop
    statement: "A recognized form is removed only when the design names it as intentionally dropped with a reason; the only such drop is the acceptance of unknown ps flags and ignored trailing tokens -- self-parsing-commands, missing-parity-coverage"
    kind: safety
    counterexample_test: "docs/designs/single-source-cli-docs.md Phase 1 T-1.3, the unknown-token criterion"
  - id: INV-short-forms-added
    statement: "The three long-only flags (sync pull --prefer-remote, sync watch --auto, sync watch --verbose) keep their long spelling and gain a non-colliding short form, so the repository's both-forms rule and its option-form test hold -- self-parsing-commands, missing-parity-coverage"
    kind: safety
    counterexample_test: "docs/designs/single-source-cli-docs.md Phase 1 T-1.3 inventory table, last column; tests/test_cli_option_forms.py"
  - id: INV-callers-tested
    statement: "Every in-repository invocation of ai ps, ai layout or ai sync (session script template, process hygiene cron path, and any other found in src/, scripts/, .githooks/ and config/) is a parity test row with its exact argument list -- self-parsing-commands, caller-compatibility"
    kind: safety
    counterexample_test: "docs/designs/single-source-cli-docs.md Phase 1 T-1.3, the in-repository caller criterion"

cells:
  - key: [missing-parity-coverage]
    invariants:
      - INV-inventory-from-source
      - INV-every-row-tested
      - INV-no-silent-drop
      - INV-short-forms-added
    disposition: OPEN
    rationale: >-
      round2:N-1, the open-blocking finding at round 2's halt, and its predecessor round1:F-2 both
      named forms the self-parsing commands accept that the parity inventory omitted. The revised
      design lists the full inventory read from the parsers and ties every row to a test. The
      conformance round checks the revised design against the four invariants above.
    evidence: "docs/audits/single-source-cli-docs-audit.receipt.jsonl round-2 audit and halt events, findings round1:F-2 and round2:N-1; commit fa1886ff"
    members: [F-2, N-1]
  - key: [caller-compatibility]
    invariants:
      - INV-callers-tested
    disposition: OPEN
    rationale: >-
      Added from the dimension challenge: round2:N-1 cited `ai sync watch --auto` as invoked by the
      shipped session script, so caller forms are frozen as their own dimension. The revised design
      makes every in-repository invocation a parity test row.
    evidence: "src/ai_cli/session_script.py sync watch invocation; round2:N-1; the dimension challenge below"
    members: [N-1]

dimension_challenge:
  reviewer: "codex gpt-5.6-sol, review role, medium effort, 2026-11-11"
  proposed_omissions:
    - "repair-worktree arguments are <project> <worktree>, not <old> <new>"
    - "a caller-compatibility dimension covering every in-repository invocation, including sync watch --auto"
    - "founding-ask disposition for the GitHub issues and Projects epic and the Discussions epic"
  disposition: >-
    The review returned REJECT with one inventory error and two omissions. All three were accepted:
    the table now names <project> <worktree>; a caller-compatibility dimension, invariant and design
    criterion were added; and the design's coverage rows now state that both epics are filed where
    the request itself directs, not dropped. The register's candidate_digest stays bound to the
    receipt's round-2 audit, and revised_target_digest records the revised file.
