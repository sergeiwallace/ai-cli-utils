name: CI

# Runs on GitHub-hosted standard runners, which are free and unmetered for public
# repositories. This workflow was previously restricted to workflow_dispatch on the
# belief that Actions billing blocked it; that was measured false --
# docs/procedures/github-actions-status.md records the evidence.
#
# ONE WORKFLOW PER OPERATING SYSTEM. This file holds the Linux jobs, `lint` and
# `test`. The Windows shards and `test-windows` live in ci-windows.yml, and the macOS
# shards and `test-macos` in ci-macos.yml, so each operating system's run can be
# cancelled and re-run on its own. All three keep the same triggers and job names.
#
# HOSTED FIRST, WITH A SELF-HOSTED FALLBACK. Every job's `runs-on` asks for the
# GitHub-hosted label on attempt 1. A later attempt of a trusted run (a push, a manual
# dispatch or a pull request from this repository) asks for a self-hosted label set
# only when the repository variable CI_FALLBACK_RUNS_ON authorizes that exact run,
# attempt and OS key (`linux` here). Steps guarded by `runner.environment` are the
# self-hosted variants; on a GitHub-hosted runner every job runs the steps it always
# ran. docs/procedures/github-actions-status.md describes the contract, and
# tests/test_ci_runner_fallback_contract.py pins it.
#
# SINGLE PYTHON VERSION (AI-CLI-6rwp). Every job below pins the one version this
# project supports, and it is the same version `.python-version` gives the local
# venv, so a local run predicts CI. Do not reintroduce a `python-version` matrix
# here: `scripts/check_python_version_sync.py` runs in the lint job and fails if
# any workflow names a version other than the one `.python-version` declares.
#
# WHAT THIS GIVES UP, stated plainly rather than discovered later. The matrices
# this replaced (3.11/3.12/3.13 on Linux and Windows) had already caught a real
# defect: on PR #190, `pathlib` refuses to instantiate a `WindowsPath` on POSIX
# up to 3.13 but ALLOWS it on 3.14, so a test that passed on the local 3.14 venv
# went red on every job at or below 3.13. Under a single-version policy that
# whole class of divergence is no longer detected by CI at all -- the way to
# catch it now is a version-independent test that forces the behaviour under
# test explicitly instead of relying on the interpreter to exhibit it, which is
# what #190 ultimately did. Cross-OS coverage is unchanged and is still the
# reason `test-windows` and `test-macos` exist.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels that pull request's older run of this
# workflow. Any other event gets a group of its own, so a push to main never cancels
# or waits on another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ${{ github.run_attempt > 1 && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_FALLBACK_RUNS_ON || '{}')[format('{0}-{1}-linux', github.run_id, github.run_attempt)] || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A self-hosted runner's account may have no writable home, and the uv cache
      # and interpreter downloads write under it.
      - name: Use a job-scoped home on a self-hosted runner
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/dolt-root"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "DOLT_ROOT_PATH=$RUNNER_TEMP/dolt-root" >> "$GITHUB_ENV"
      - if: runner.environment == 'github-hosted'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Kept in sync with `.python-version` by the version-sync step below.
          python-version: "3.14"
      # setup-uv can hang behind a self-hosted runner's egress proxy, so a self-hosted
      # attempt uses uv's installer script, fetching uv from GitHub releases. uv then
      # takes the interpreter version from `.python-version`.
      - name: Install uv on a self-hosted runner
        if: runner.environment == 'self-hosted'
        env:
          UV_INSTALLER_GITHUB_BASE_URL: https://github.com
          UV_INSTALL_DIR: ${{ runner.temp }}/uv-bin
          UV_NO_MODIFY_PATH: "1"
          UV_DISABLE_UPDATE: "1"
        run: |
          curl -LsSf https://astral.sh/uv/install.sh -o "$RUNNER_TEMP/uv-installer.sh"
          sh "$RUNNER_TEMP/uv-installer.sh"
          "$UV_INSTALL_DIR/uv" --version
          echo "$UV_INSTALL_DIR" >> "$GITHUB_PATH"
      # `--locked` refuses to re-resolve: it fails with "the lockfile at `uv.lock`
      # needs to be updated" and names `uv lock` as the remedy. Without it, `uv sync`
      # silently RE-RESOLVES whenever `pyproject.toml` and `uv.lock` disagree, so a
      # pull request could go green having tested versions that are not the ones it
      # ships, and nothing in the log said so (AI-CLI-qqnx). Every sync step in every
      # workflow carries the flag, and `tests/test_ci_lock_assertion.py` fails if one
      # stops carrying it.
      - run: uv sync --locked --dev
      # Runs BEFORE the other checks on purpose: if the interpreter this job is
      # running does not match what the repo declares, every result below it is
      # about the wrong Python and a green tick would be misleading.
      - run: uv run python scripts/check_python_version_sync.py
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run pyright src/
      - if: runner.environment == 'github-hosted'
        run: python scripts/lint_doc_alignment.py
      # A self-hosted runner need not put an unversioned `python` on PATH, so the
      # standard-library script runs on the project interpreter there.
      - if: runner.environment == 'self-hosted'
        run: uv run python scripts/lint_doc_alignment.py
      # The published package declares `requires-python = ">=3.11"` while this repo
      # develops and tests on 3.14 alone (AI-CLI-dgbd). Those are different claims,
      # but the wider one still has to be falsifiable or it is just an assertion --
      # so the floor interpreter byte-compiles the shipped source here.
      #
      # This is not a second test matrix and must not grow into one: no dependencies
      # are installed and no tests run, which is why it costs seconds. What it catches
      # is the realistic regression -- somebody uses syntax newer than the floor and
      # the published package stops importing for every user below 3.14, silently,
      # because nothing else in CI ever parses the source as an older Python.
      #
      # `--no-project` keeps uv from refusing the interpreter for disagreeing with
      # `requires-python`'s own project context.
      - name: Shipped source parses on the declared floor interpreter
        run: uv run --python 3.11 --no-project python -m compileall -q src/

  test:
    runs-on: ${{ github.run_attempt > 1 && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_FALLBACK_RUNS_ON || '{}')[format('{0}-{1}-linux', github.run_id, github.run_attempt)] || 'ubuntu-latest' }}
    services:
      nats:
        # The same routing test as `runs-on`, hosted case first: an empty image means
        # the service does not start, which a self-hosted runner without Docker
        # needs. `<routed> && '' || 'nats:latest'` would not work, because `''` is
        # falsy and the expression would always fall through to `nats:latest`. The
        # suite tolerates NATS being absent: the tests that need it skip.
        image: ${{ !(github.run_attempt > 1 && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_FALLBACK_RUNS_ON || '{}')[format('{0}-{1}-linux', github.run_id, github.run_attempt)]) && 'nats:latest' || '' }}
        ports:
          - 4222:4222
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A self-hosted runner's account may have no writable home, and the uv cache,
      # Dolt's config and the coverage upload all write under it.
      - name: Use a job-scoped home on a self-hosted runner
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/dolt-root"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "DOLT_ROOT_PATH=$RUNNER_TEMP/dolt-root" >> "$GITHUB_ENV"
      - if: runner.environment == 'github-hosted'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Kept in sync with `.python-version` by the lint job's version-sync step.
          python-version: "3.14"
      - name: Install uv on a self-hosted runner
        if: runner.environment == 'self-hosted'
        env:
          UV_INSTALLER_GITHUB_BASE_URL: https://github.com
          UV_INSTALL_DIR: ${{ runner.temp }}/uv-bin
          UV_NO_MODIFY_PATH: "1"
          UV_DISABLE_UPDATE: "1"
        run: |
          curl -LsSf https://astral.sh/uv/install.sh -o "$RUNNER_TEMP/uv-installer.sh"
          sh "$RUNNER_TEMP/uv-installer.sh"
          "$UV_INSTALL_DIR/uv" --version
          echo "$UV_INSTALL_DIR" >> "$GITHUB_PATH"
      # tmux is a HARD requirement of this suite (AI-CLI-qzf2), so every platform
      # provisions it explicitly and this was the last job that did not. It relied on
      # the runner image happening to ship one, which is the same implicit dependency
      # `test-macos` removed -- and "happens to be there" is not a dependency, it
      # is a coincidence that decides how much this job covers. `tmux -V` is part of the
      # step rather than a nicety: an install that succeeds while producing a binary
      # that cannot run is a real failure mode here (AI-CLI-i2ih), and it would
      # otherwise surface as unexplained test failures much later in the job.
      - name: Install tmux
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V
      # A self-hosted runner has no privilege to install packages, so the host
      # provides tmux and this step proves it runs.
      - name: Require tmux on a self-hosted runner
        if: runner.environment == 'self-hosted'
        run: tmux -V
      # The session-name registry tests run the real `dolt` program against a bare git
      # remote (docs/designs/session-name-registry-dolt.md). The version is the design's
      # floor, D-6. In CI a Dolt test fails rather than skips when the binary is missing,
      # so this step going missing shows as red, never as a smaller green run.
      - name: Install Dolt
        run: |
          curl -fsSL -o "$RUNNER_TEMP/dolt.tar.gz" https://github.com/dolthub/dolt/releases/download/v2.3.4/dolt-linux-amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/dolt.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dolt-linux-amd64/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/dolt-linux-amd64/bin/dolt" version
      - run: uv sync --locked --dev
      # CI_TEST_WRAPPER is a command prefix a self-hosted runner may export, for
      # example to run the suite in its own network namespace. It is unset on
      # GitHub-hosted runners, where the expansion is empty.
      - run: ${CI_TEST_WRAPPER:-} uv run pytest --cov=ai_cli --cov-report=xml --tb=short -q
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
