<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background: dark rounded square -->
  <rect width="200" height="200" rx="36" fill="#0d1117"/>

  <!-- Subtle grid -->
  <line x1="0" y1="100" x2="200" y2="100" stroke="#ffffff" stroke-width="0.4" opacity="0.04"/>
  <line x1="100" y1="0" x2="100" y2="200" stroke="#ffffff" stroke-width="0.4" opacity="0.04"/>

  <!-- Winking eye: bold > chevron, upper left of center -->
  <polyline points="62,62 90,82 62,102"
            fill="none" stroke="#00d4ff" stroke-width="7"
            stroke-linecap="square" stroke-linejoin="miter"
            filter="url(#glow)"/>

  <!-- Blinking cursor _ as mouth: lower right of center, offset for smirk -->
  <line x1="96" y1="126" x2="142" y2="126"
        stroke="#00d4ff" stroke-width="7"
        stroke-linecap="square" filter="url(#glow)"/>

  <!-- Small neural nodes — subtle, corners -->
  <circle cx="34" cy="34" r="3" fill="#00d4ff" opacity="0.35" filter="url(#softglow)"/>
  <circle cx="166" cy="34" r="3" fill="#00d4ff" opacity="0.35" filter="url(#softglow)"/>
  <circle cx="34" cy="166" r="3" fill="#00d4ff" opacity="0.35" filter="url(#softglow)"/>
  <circle cx="166" cy="166" r="3" fill="#00d4ff" opacity="0.35" filter="url(#softglow)"/>
</svg>
