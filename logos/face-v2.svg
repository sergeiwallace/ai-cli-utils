<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="36" fill="#0d1117"/>

  <!-- Subtle face outline -->
  <ellipse cx="100" cy="100" rx="68" ry="72"
           fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.2"/>

  <!-- Other eye: open dot -->
  <circle cx="72" cy="82" r="5" fill="#00d4ff" filter="url(#glow)" opacity="0.9"/>

  <!-- Winking eye: > drawn as polyline -->
  <polyline points="102,68 126,82 102,96"
            fill="none" stroke="#00d4ff" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round"
            filter="url(#glow)"/>

  <!-- Mouth: _ drawn as a short line, slight smirk -->
  <line x1="72" y1="128" x2="118" y2="124"
        stroke="#00d4ff" stroke-width="4.5"
        stroke-linecap="round" filter="url(#glow)"/>
</svg>
