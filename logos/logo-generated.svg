<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="prompt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#a371f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="66" x2="200" y2="66" stroke="#ffffff" stroke-width="0.4" opacity="0.05"/>
  <line x1="0" y1="133" x2="200" y2="133" stroke="#ffffff" stroke-width="0.4" opacity="0.05"/>
  <line x1="66" y1="0" x2="66" y2="200" stroke="#ffffff" stroke-width="0.4" opacity="0.05"/>
  <line x1="133" y1="0" x2="133" y2="200" stroke="#ffffff" stroke-width="0.4" opacity="0.05"/>

  <!-- Neural nodes -->
  <circle cx="30" cy="30" r="3.5" fill="#58a6ff" opacity="0.5"/>
  <circle cx="100" cy="20" r="3.5" fill="#a371f7" opacity="0.5"/>
  <circle cx="170" cy="30" r="3.5" fill="#58a6ff" opacity="0.5"/>
  <circle cx="170" cy="170" r="3.5" fill="#a371f7" opacity="0.5"/>
  <circle cx="30" cy="170" r="3.5" fill="#58a6ff" opacity="0.5"/>
  <circle cx="20" cy="100" r="3.5" fill="#a371f7" opacity="0.4"/>
  <circle cx="180" cy="100" r="3.5" fill="#58a6ff" opacity="0.4"/>

  <!-- Node connections -->
  <line x1="30" y1="30" x2="100" y2="20" stroke="#58a6ff" stroke-width="0.8" opacity="0.15"/>
  <line x1="100" y1="20" x2="170" y2="30" stroke="#a371f7" stroke-width="0.8" opacity="0.15"/>
  <line x1="30" y1="30" x2="20" y2="100" stroke="#58a6ff" stroke-width="0.8" opacity="0.15"/>
  <line x1="170" y1="30" x2="180" y2="100" stroke="#a371f7" stroke-width="0.8" opacity="0.15"/>
  <line x1="20" y1="100" x2="30" y2="170" stroke="#58a6ff" stroke-width="0.8" opacity="0.15"/>
  <line x1="180" y1="100" x2="170" y2="170" stroke="#a371f7" stroke-width="0.8" opacity="0.15"/>

  <!-- Prompt symbol > with glow -->
  <text x="28" y="122" font-family="'SF Mono', 'Fira Code', monospace" font-size="78" font-weight="700"
        fill="url(#prompt)" filter="url(#glow)" opacity="0.95">&#62;_</text>
</svg>
